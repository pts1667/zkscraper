[package]
name = "zkscraper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-macros = { version = "0.2.0-alpha.6" }
tokio = { version = "1.45.1", features = ["full"] }
clap = { version = "4.5.40", features = ["derive"] }
url = "2.5"
regex = "1.11"
csv = "1.3"
indicatif = "0.17"
flate2 = "1.1"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
zstd = "0.13"
zip = "2.2"
